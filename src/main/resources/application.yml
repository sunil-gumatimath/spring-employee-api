spring:
  application:
    name: employee-management-system-api

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:employee-management-curd-api-db}?createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    show-sql: ${SHOW_SQL:false}
    hibernate:
      # Schema is owned by Flyway (src/main/resources/db/migration). Hibernate only
      # verifies that the mappings match the migrated schema; it must never mutate it.
      ddl-auto: ${DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: ${FORMAT_SQL:false}

  flyway:
    enabled: true
    locations: classpath:db/migration
    # Existing installations created their table via the previous ddl-auto:update
    # setting. Baseline it so Flyway adopts the table as V1 instead of failing on it.
    baseline-on-migrate: true
    baseline-version: 0

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never