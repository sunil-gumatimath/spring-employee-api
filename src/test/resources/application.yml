spring:
  datasource:
    url: jdbc:h2:mem:employee-test-db;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    open-in-view: false
    show-sql: false
    hibernate:
      # Flyway owns the test schema too, so tests exercise the real migration and
      # validate the entity mapping against the same DDL production uses.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100